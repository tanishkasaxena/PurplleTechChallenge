[project]
name = "purplle-offline-analytics"
version = "0.1.0"
description = "Offline retail conversion analytics from CCTV and POS events"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "sqlalchemy>=2.0.0",
  "opencv-python>=4.10.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "ultralytics>=8.2.0",
  "streamlit>=1.37.0",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

